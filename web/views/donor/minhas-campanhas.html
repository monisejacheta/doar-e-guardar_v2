<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Campanhas | Casa da Criança</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastelBlue: '#E6F0FA',
            pastelGreen: '#D1F0E4',
            pastelYellow: '#FFF4D6',
            textDark: '#2D3748',
            brandBlue: '#1E3A8A',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../../public/css/styles.css">
  <script src="../../public/js/accessibility.js" defer></script>
</head>
<body class="bg-slate-50 text-textDark flex h-screen overflow-hidden font-sans relative">

  <div id="sidebar-doador-container"></div>

  <!-- Área Principal -->
  <main class="flex-1 overflow-y-auto bg-slate-50 relative scroll-smooth p-3 lg:p-5 space-y-3.5">

    <!-- Cabeçalho -->
    <header class="bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5">
      <div class="min-w-0 flex-1">
        <span class="inline-flex items-center gap-1.5 bg-pastelBlue text-brandBlue px-2 py-0.5 rounded-full font-bold text-[10px] mb-0.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
          <span>Campanhas atualizadas em tempo real</span>
        </span>
        <h1 class="text-lg lg:text-xl font-extrabold text-brandBlue flex items-center gap-2">
          <i class="ph ph-folder-star text-xl shrink-0"></i>
          <span class="truncate">Minhas Campanhas</span>
        </h1>
      </div>

      <div class="flex flex-wrap items-center gap-2 shrink-0 w-full sm:w-auto">
        <button type="button" onclick="buscarMinhasCampanhasAws()" class="flex-1 sm:flex-initial w-32 inline-flex items-center justify-center gap-1.5 bg-pastelBlue/70 hover:bg-pastelBlue text-brandBlue font-bold px-3 py-1.5 rounded-xl transition border border-blue-200 text-xs">
          <i id="icone-sync-minhas" class="ph-bold ph-arrows-clockwise text-sm shrink-0"></i>
          <span>Atualizar</span>
        </button>
        <a href="./campanhas.html" class="flex-1 sm:flex-initial w-32 inline-flex items-center justify-center gap-1.5 bg-pastelGreen hover:bg-[#b5ead5] text-emerald-900 font-bold px-3 py-1.5 rounded-xl transition shadow-sm border border-emerald-200 text-xs">
          <i class="ph-fill ph-plus-circle text-sm text-emerald-700 shrink-0"></i>
          <span>Nova Proposta</span>
        </a>
      </div>
    </header>

    <!-- Seletor de Escopo + Abas de Status -->
    <section class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span class="text-xs font-bold text-brandBlue">Visualizar:</span>
        <div class="flex items-center gap-1.5">
          <button type="button" id="btn-escopo-minhas" onclick="alternarEscopoCampanhas(true)" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-brandBlue text-white transition">Apenas Minhas</button>
          <button type="button" id="btn-escopo-todas" onclick="alternarEscopoCampanhas(false)" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Todas da Comunidade</button>
        </div>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 items-stretch">
        <button type="button" onclick="filtrarMinhasPorStatus('TODAS')" id="tab-minhas-TODAS" class="h-full px-3 py-2 rounded-xl bg-pastelBlue/60 border border-pastelBlue text-left transition">
          <span class="text-[10px] font-bold uppercase text-brandBlue block truncate">Todas</span>
          <span id="count-minhas-todas" class="text-lg font-extrabold text-brandBlue block">0</span>
        </button>
        <button type="button" onclick="filtrarMinhasPorStatus('pendente')" id="tab-minhas-pendente" class="h-full px-3 py-2 rounded-xl bg-pastelYellow/70 border border-pastelYellow text-left transition">
          <span class="text-[10px] font-bold uppercase text-yellow-900 block truncate">Em Análise</span>
          <span id="count-minhas-pendente" class="text-lg font-extrabold text-yellow-900 block">0</span>
        </button>
        <button type="button" onclick="filtrarMinhasPorStatus('aprovada')" id="tab-minhas-aprovada" class="h-full px-3 py-2 rounded-xl bg-pastelGreen/60 border border-pastelGreen text-left transition">
          <span class="text-[10px] font-bold uppercase text-emerald-900 block truncate">Ativas</span>
          <span id="count-minhas-aprovada" class="text-lg font-extrabold text-emerald-900 block">0</span>
        </button>
        <button type="button" onclick="filtrarMinhasPorStatus('encerrada')" id="tab-minhas-encerrada" class="h-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-left transition">
          <span class="text-[10px] font-bold uppercase text-slate-600 block truncate">Finalizadas</span>
          <span id="count-minhas-encerrada" class="text-lg font-extrabold text-slate-800 block">0</span>
        </button>
        <button type="button" onclick="filtrarMinhasPorStatus('reprovada')" id="tab-minhas-reprovada" class="h-full px-3 py-2 rounded-xl bg-red-50/80 border border-red-200 text-left transition">
          <span class="text-[10px] font-bold uppercase text-red-800 block truncate">Recusadas</span>
          <span id="count-minhas-reprovada" class="text-lg font-extrabold text-red-700 block">0</span>
        </button>
      </div>
    </section>

    <!-- Lista de Campanhas -->
    <section id="container-campanhas">
      <div id="loading" class="flex flex-col items-center justify-center py-10 text-brandBlue text-xs bg-white rounded-2xl border border-slate-200">
        <i class="ph ph-spinner-gap text-3xl animate-spin mb-2"></i>
        <p class="font-semibold">Carregando suas campanhas...</p>
      </div>
      <div id="lista-campanhas" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-3.5 items-start"></div>
    </section>
  </main>

  <script src="../../public/js/sidebar-doador.js?v=1"></script>
  <script src="../../public/js/donor-minhas-campanhas.js?v=1"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDmJWmKMOgSQg0XxfpAVtrNy8XY79G7VM",
      authDomain: "doar-e-guardar-v2.firebaseapp.com",
      projectId: "doar-e-guardar-v2",
      storageBucket: "doar-e-guardar-v2.firebasestorage.app",
      messagingSenderId: "206062751062",
      appId: "1:206062751062:web:38cda34f65ca612043daf7",
      measurementId: "G-87KFR89NX0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    renderizarSidebarDoador('minhas-campanhas');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        atualizarUsuarioSidebarDoador(user);
        buscarMinhasCampanhasAws(user);
      } else {
        window.location.href = '../../index.html';
      }
    });

    window.realizarLogout = async () => {
      await signOut(auth);
      window.location.href = '../../index.html';
    };
  </script>
</body>
</html>
