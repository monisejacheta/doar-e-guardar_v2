<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil &amp; Preferências | Casa da Criança</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastelBlue: '#E6F0FA',
            pastelGreen: '#D1F0E4',
            pastelYellow: '#FFF4D6',
            textDark: '#2D3748',
            brandBlue: '#1E3A8A',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../../public/css/styles.css">
  <script src="../../public/js/accessibility.js" defer></script>
</head>
<body class="bg-slate-50 text-textDark flex h-screen overflow-hidden font-sans relative">

  <div id="sidebar-doador-container"></div>

  <!-- Área Principal -->
  <main class="flex-1 overflow-y-auto bg-slate-50 relative scroll-smooth p-3 lg:p-5 space-y-3.5">

    <!-- Cabeçalho Compacto -->
    <header class="bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5">
      <div class="min-w-0 flex-1">
        <span class="inline-flex items-center gap-1.5 bg-pastelBlue text-brandBlue px-2 py-0.5 rounded-full font-bold text-[10px] mb-0.5">
          <i class="ph-fill ph-shield-check"></i>
          <span>Conta, WhatsApp e Acessibilidade</span>
        </span>
        <h1 class="text-lg lg:text-xl font-extrabold text-brandBlue flex items-center gap-2">
          <i class="ph ph-user-gear text-xl shrink-0"></i>
          <span class="truncate">Meu Perfil e Preferências</span>
        </h1>
      </div>
    </header>

    <div id="feedback-config-doador" class="hidden p-3 rounded-xl border font-semibold text-xs flex items-center justify-between gap-3"></div>

    <!-- Formulário Perfil + WhatsApp -->
    <form onsubmit="salvarConfiguracoesDoador(event)" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <h2 class="text-sm font-bold text-brandBlue flex items-center gap-1.5 border-b border-slate-100 pb-2">
        <i class="ph-fill ph-identification-card text-base text-blue-500"></i> Meus Dados e Contato
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
        <div>
          <label for="perfil-nome" class="block text-[11px] font-bold text-brandBlue uppercase mb-1">Nome</label>
          <input type="text" id="perfil-nome" readonly disabled class="w-full px-3.5 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs text-slate-600 cursor-not-allowed">
        </div>
        <div>
          <label for="perfil-email" class="block text-[11px] font-bold text-brandBlue uppercase mb-1">E-mail da Conta</label>
          <input type="email" id="perfil-email" readonly disabled class="w-full px-3.5 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs text-slate-600 cursor-not-allowed">
        </div>
        <div>
          <label for="perfil-whatsapp" class="block text-[11px] font-bold text-brandBlue uppercase mb-1">WhatsApp (com DDD)</label>
          <input type="text" id="perfil-whatsapp" placeholder="Ex: 5519987654321" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brandBlue">
        </div>
      </div>

      <label class="flex items-start gap-3 p-3.5 bg-pastelGreen/40 rounded-xl border border-pastelGreen cursor-pointer hover:border-emerald-400 transition">
        <input type="checkbox" id="optin-whatsapp" checked class="w-4 h-4 mt-0.5 accent-emerald-700 shrink-0">
        <div class="min-w-0 flex-1">
          <span class="font-bold text-xs text-emerald-900 block">Autorizo receber avisos pelo WhatsApp</span>
          <span class="text-[11px] text-slate-600">Avisos sobre itens urgentes que a instituição precisa e atualizações das suas campanhas. Você pode desativar quando quiser.</span>
        </div>
      </label>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
        <span class="text-[11px] text-slate-500">Última atualização: <strong id="timestamp-consentimento">--/--/----</strong></span>
        <button id="btn-salvar-config-doador" type="submit" class="bg-brandBlue hover:bg-blue-900 text-white font-bold px-5 py-2 rounded-xl transition shadow-sm inline-flex items-center gap-1.5 text-xs">
          <i class="ph-bold ph-floppy-disk text-sm"></i>
          <span>Salvar Preferências</span>
        </button>
      </div>
    </form>

    <!-- Seção de Acessibilidade -->
    <section class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2">
        <h2 class="text-sm font-bold text-brandBlue flex items-center gap-1.5">
          <i class="ph-fill ph-sliders text-base text-blue-500"></i> Acessibilidade Visual
        </h2>
        <button type="button" onclick="restaurarAcessibilidadePadrao()" class="text-[11px] font-bold text-slate-600 hover:text-brandBlue underline">
          Restaurar padrão
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Modo Noturno / Dark Mode -->
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col justify-between gap-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h3 class="text-xs font-bold text-brandBlue">Modo Noturno (Dark Mode)</h3>
              <p class="text-[11px] text-slate-500 mt-0.5">Escurece o fundo para reduzir o cansaço visual.</p>
            </div>
            <span id="status-alto-contraste" class="px-2.5 py-0.5 rounded-lg text-[11px] font-bold bg-slate-200 text-slate-700 shrink-0">Desativado</span>
          </div>
          <button type="button" onclick="alternarAltoContrastePagina()" class="w-full py-2 px-3 rounded-xl bg-white border border-slate-200 hover:border-brandBlue text-brandBlue font-bold text-xs inline-flex items-center justify-center gap-1.5 transition">
            <i class="ph-bold ph-moon text-sm"></i>
            <span>Alternar Modo Noturno</span>
          </button>
        </div>

        <!-- Tamanho da Fonte -->
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col justify-between gap-3">
          <div>
            <h3 class="text-xs font-bold text-brandBlue">Tamanho do Texto</h3>
            <p class="text-[11px] text-slate-500 mt-0.5">Escolha o tamanho de fonte mais confortável para você.</p>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" id="btn-fonte-normal" onclick="definirTamanhoFontePagina('normal')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold border transition">
              Normal
            </button>
            <button type="button" id="btn-fonte-large" onclick="definirTamanhoFontePagina('large')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold border transition">
              Grande
            </button>
            <button type="button" id="btn-fonte-extra" onclick="definirTamanhoFontePagina('extra')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold border transition">
              Extra
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="../../public/js/sidebar-doador.js?v=1"></script>
  <script src="../../public/js/donor-configuracoes.js?v=1"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDmJWmKMOgSQg0XxfpAVtrNy8XY79G7VM",
      authDomain: "doar-e-guardar-v2.firebaseapp.com",
      projectId: "doar-e-guardar-v2",
      storageBucket: "doar-e-guardar-v2.firebasestorage.app",
      messagingSenderId: "206062751062",
      appId: "1:206062751062:web:38cda34f65ca612043daf7",
      measurementId: "G-87KFR89NX0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    renderizarSidebarDoador('configuracoes');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        atualizarUsuarioSidebarDoador(user);
        carregarDadosPerfilDoador(user);
      } else {
        window.location.href = '../../index.html';
      }
    });

    window.realizarLogout = async () => {
      try {
        await signOut(auth);
        window.location.href = '../../index.html';
      } catch (erro) {
        console.error('Erro ao deslogar:', erro);
      }
    };
  </script>
</body>
</html>
