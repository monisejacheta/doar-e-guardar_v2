<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armários e Geladeiras | Casa da Criança</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastelBlue: '#E6F0FA',
            pastelGreen: '#D1F0E4',
            pastelYellow: '#FFF4D6',
            textDark: '#2D3748',
            brandBlue: '#1E3A8A',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="../../public/css/styles.css">
  <script src="../../public/js/accessibility.js" defer></script>
</head>
<body class="bg-slate-50 text-textDark flex h-screen overflow-hidden font-sans relative">

  <div id="sidebar-admin-container"></div>

  <main class="flex-1 overflow-y-auto bg-slate-50 relative scroll-smooth p-3 lg:p-5 space-y-3.5">

    <!-- Cabeçalho -->
    <header class="bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5">
      <div class="min-w-0 flex-1">
        <span class="inline-flex items-center gap-1.5 bg-pastelBlue text-brandBlue px-2 py-0.5 rounded-full font-bold text-[10px] mb-0.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
          <span>Locais atualizados em tempo real</span>
        </span>
        <h1 class="text-lg lg:text-xl font-extrabold text-brandBlue flex items-center gap-2">
          <i class="ph ph-archive-box text-xl shrink-0"></i>
          <span class="truncate">Armários e Geladeiras</span>
        </h1>
      </div>
      
      <div class="flex flex-wrap items-center gap-2 shrink-0 w-full sm:w-auto">
        <button type="button" onclick="sincronizarLocaisComAws()" class="flex-1 sm:flex-initial w-28 inline-flex items-center justify-center gap-1.5 bg-pastelBlue/70 hover:bg-pastelBlue text-brandBlue font-bold px-3 py-1.5 rounded-xl transition border border-blue-200 text-xs">
          <i id="icone-sync-locais" class="ph-bold ph-arrows-clockwise text-sm shrink-0"></i>
          <span>Atualizar</span>
        </button>
        <button type="button" onclick="abrirModalNovoLocal()" class="flex-1 sm:flex-initial w-28 inline-flex items-center justify-center gap-1.5 bg-pastelGreen hover:bg-[#b5ead5] text-emerald-900 font-bold px-3 py-1.5 rounded-xl transition shadow-sm border border-emerald-200 text-xs">
          <i class="ph-bold ph-plus-circle text-sm text-emerald-700 shrink-0"></i>
          <span>Novo Local</span>
        </button>
      </div>
    </header>

    <!-- Resumo Rápido Compacto -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 items-stretch" aria-label="Resumo dos Locais">
      <div class="h-full bg-pastelBlue/60 border border-pastelBlue px-3.5 py-2.5 rounded-xl shadow-sm flex items-center justify-between gap-2">
        <div class="min-w-0 flex-1">
          <span class="text-[10px] font-bold uppercase tracking-wide text-brandBlue block truncate">Total de Locais</span>
          <h3 id="stat-total-locais" class="text-lg font-extrabold text-brandBlue leading-tight truncate">--</h3>
        </div>
        <div class="w-8 h-8 bg-white text-brandBlue rounded-lg flex items-center justify-center text-base shadow-sm shrink-0">
          <i class="ph-fill ph-archive-box"></i>
        </div>
      </div>

      <div class="h-full bg-pastelGreen/60 border border-pastelGreen px-3.5 py-2.5 rounded-xl shadow-sm flex items-center justify-between gap-2">
        <div class="min-w-0 flex-1">
          <span class="text-[10px] font-bold uppercase tracking-wide text-emerald-900 block truncate">Com Produtos</span>
          <h3 id="stat-em-uso" class="text-lg font-extrabold text-emerald-900 leading-tight truncate">--</h3>
        </div>
        <div class="w-8 h-8 bg-white text-emerald-700 rounded-lg flex items-center justify-center text-base shadow-sm shrink-0">
          <i class="ph-fill ph-package"></i>
        </div>
      </div>

      <div class="h-full bg-white border border-slate-200 px-3.5 py-2.5 rounded-xl shadow-sm flex items-center justify-between gap-2">
        <div class="min-w-0 flex-1">
          <span class="text-[10px] font-bold uppercase tracking-wide text-slate-500 block truncate">Espaços Livres</span>
          <h3 id="stat-livres" class="text-lg font-extrabold text-slate-700 leading-tight truncate">--</h3>
        </div>
        <div class="w-8 h-8 bg-slate-100 text-slate-600 rounded-lg flex items-center justify-center text-base shadow-sm shrink-0">
          <i class="ph-fill ph-check-circle"></i>
        </div>
      </div>
    </section>

    <!-- Filtros Compactos -->
    <section class="bg-white px-4 py-3 rounded-2xl border border-slate-200 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 items-end">
        <div class="md:col-span-6">
          <label for="busca-local" class="block text-[10px] font-bold text-brandBlue uppercase mb-0.5">Buscar armário, geladeira ou ambiente</label>
          <div class="relative">
            <i class="ph ph-magnifying-glass absolute left-2.5 top-2 text-slate-400 text-sm"></i>
            <input type="text" id="busca-local" oninput="renderizarGridLocais()" placeholder="Ex: Armário A, Geladeira, Cozinha..." class="w-full pl-8 pr-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-brandBlue">
          </div>
        </div>

        <div class="md:col-span-4">
          <label for="filtro-tipo-local" class="block text-[10px] font-bold text-brandBlue uppercase mb-0.5">Tipo de Local</label>
          <select id="filtro-tipo-local" onchange="renderizarGridLocais()" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-brandBlue">
            <option value="TODOS">Todos os tipos</option>
            <option value="armário">Armários</option>
            <option value="geladeira">Geladeiras</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <button type="button" onclick="limparFiltrosLocais()" class="w-full py-1.5 px-2.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition">
            Limpar
          </button>
        </div>
      </div>
    </section>

    <div id="alerta-locais" class="hidden p-3 rounded-xl border font-semibold text-xs flex items-center justify-between gap-3"></div>

    <!-- Grade de Locais -->
    <section id="grid-locais-armazenamento" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3.5 items-start">
      <div class="md:col-span-2 xl:col-span-3 bg-white p-8 rounded-2xl border border-slate-200 text-center text-brandBlue font-semibold text-xs">
        <i class="ph ph-spinner-gap text-2xl animate-spin inline-block mb-1"></i><br>
        Carregando armários e geladeiras...
      </div>
    </section>

  </main>

  <!-- MODAL CRIAR / EDITAR LOCAL -->
  <div id="modal-local-armazenamento" class="hidden fixed inset-0 bg-brandBlue/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-6 relative transform scale-95 transition-transform duration-300">
      <button type="button" onclick="fecharModal('modal-local-armazenamento')" class="absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 transition">
        <i class="ph ph-x text-lg"></i>
      </button>

      <div class="mb-4">
        <h3 id="titulo-modal-local" class="text-xl font-bold text-brandBlue">Novo Local</h3>
        <p class="text-slate-500 text-xs mt-0.5">Cadastre ou atualize um armário ou geladeira da instituição.</p>
      </div>

      <div class="p-3 rounded-xl bg-pastelYellow/60 border border-pastelYellow text-[11px] font-medium text-yellow-900 mb-4">
        São permitidos apenas locais do tipo <strong>Armário</strong> ou <strong>Geladeira</strong>.
      </div>

      <form onsubmit="salvarLocalAws(event)" class="space-y-3.5">
        <input type="hidden" id="local-id-edit">

        <div>
          <label for="local-nome-movel" class="block text-[11px] font-bold text-brandBlue uppercase mb-1">Nome do Armário ou Geladeira *</label>
          <input type="text" id="local-nome-movel" required placeholder="Ex: Armário C ou Geladeira 2" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brandBlue">
        </div>

        <div>
          <label for="local-sublocal" class="block text-[11px] font-bold text-brandBlue uppercase mb-1">Prateleira ou Gaveta *</label>
          <input type="text" id="local-sublocal" required placeholder="Ex: Prateleira 1 ou Gaveta Inferior" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brandBlue">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="local-tipo" class="block text-[11px] font-bold text-brandBlue uppercase mb-1">Tipo *</label>
            <select id="local-tipo" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brandBlue">
              <option value="armário">Armário</option>
              <option value="geladeira">Geladeira</option>
            </select>
          </div>
          <div>
            <label for="local-ambiente" class="block text-[11px] font-bold text-brandBlue uppercase mb-1">Ambiente *</label>
            <input type="text" id="local-ambiente" required value="Despensa Principal" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brandBlue">
          </div>
        </div>

        <div class="flex justify-end gap-2.5 pt-3 border-t border-slate-100">
          <button type="button" onclick="fecharModal('modal-local-armazenamento')" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold text-xs">Cancelar</button>
          <button type="submit" id="btn-salvar-local" class="px-5 py-2 rounded-xl bg-pastelGreen hover:bg-[#b5ead5] text-emerald-900 border border-emerald-200 font-bold text-xs shadow-sm transition">
            Salvar Local
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../public/js/admin.js?v=7"></script>
  <script src="../../public/js/admin-locais.js?v=7"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderizarSidebarAdmin('locais-armazenamento');
      sincronizarLocaisComAws();
    });
  </script>
</body>
</html>
